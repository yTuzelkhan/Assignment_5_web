<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment #5</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        input{
            width: 100%;
            height: 30px;
            border: 1px solid #000000;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        button {
            padding: 5px 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            height: 30px;
            margin-right: 5px;
            cursor: pointer;
        }
        h2 {
            color: #333;
        }
        form {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div>
        <h2>Part 1: Profile & Arithmetic</h2>
        <p><strong>Name:</strong> <span id="displayName"></span></p>
        <p><strong>Birth Year:</strong> <span id="displayYear"></span></p>
        <p><strong>Calculated Age:</strong> <span id="displayAge"></span></p>
        <p><strong>Age in Months:</strong> <span id="displayMonths"></span></p>
        <p><strong>Developer Status:</strong> <span id="displayDev"></span></p>
        <p><strong>Total Hobbies:</strong> <span id="displayHobbiesCount"></span></p>
    </div>

    <div>
        <h2>Part 2: Form Input & Events</h2>
        <form id="profileForm">
            <label for="username">Username:</label><br>
            <input type="text" id="username" required><br><br>

            <label for="birthYear">Birth Year:</label><br>
            <input type="number" id="birthYear" required><br><br>

            <button type="submit">Update Profile</button>
        </form>
    </div>

    <div>
        <h2>Part 3: List Manipulation</h2>
        <input type="text" id="hobbyInput" placeholder="New hobby">
        <button id="addBtn">Add</button>
        <button id="removeBtn">Remove</button>
        <ul id="hobbyList"></ul>
    </div>

    <script>
        const userProfile = {
            name: "Yermek",
            birthYear: 2007,
            isDeveloper: true,
            hobbies: ["Coding", "Football", "Reading"]
        };
        const form = document.getElementById("profileForm");
        const nameInput = document.getElementById("username");
        const yearInput = document.getElementById("birthYear");
        const hobbyInput = document.getElementById("hobbyInput");
        const hobbyList = document.getElementById("hobbyList");

        function updateUI() {
            const age = new Date().getFullYear() - userProfile.birthYear;

            document.getElementById("displayName").textContent = userProfile.name;
            document.getElementById("displayYear").textContent = userProfile.birthYear;
            document.getElementById("displayAge").textContent = age;
            document.getElementById("displayMonths").textContent = age * 12;
            document.getElementById("displayDev").textContent = userProfile.isDeveloper ? "Yes" : "No";
            document.getElementById("displayHobbiesCount").textContent = userProfile.hobbies.length;
        }

        function renderHobbies() {
            hobbyList.innerHTML = "";
            userProfile.hobbies.forEach(hobby => {
                const li = document.createElement("li");
                li.textContent = hobby;
                hobbyList.appendChild(li);
            });
        }

        form.addEventListener("submit", (e) => {
            e.preventDefault();
            userProfile.name = nameInput.value.trim();
            userProfile.birthYear = parseInt(yearInput.value, 10);
            updateUI();
        });

        document.getElementById("addBtn").addEventListener("click", () => {
            const value = hobbyInput.value.trim();
            if (value) {
                userProfile.hobbies.push(value);
                hobbyInput.value = "";
                renderHobbies();
                updateUI();
            }
        });

        document.getElementById("removeBtn").addEventListener("click", () => {
            if (userProfile.hobbies.length > 0) {
                userProfile.hobbies.pop();
                renderHobbies();
                updateUI();
            }
        });

        nameInput.value = userProfile.name;
        yearInput.value = userProfile.birthYear;
        updateUI();
        renderHobbies();
    </script>
</body>
</html>
